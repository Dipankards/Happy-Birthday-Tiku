<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Tiku ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         OPENING SCREEN
    ========================================== -->

    <main class="opening-screen" id="openingScreen">

        <!-- Background glow -->
        <div class="background-glow"></div>

        <!-- Stars -->
        <div class="stars"></div>

        <!-- =====================================
             INTRO TEXT
        ====================================== -->

        <div class="intro-text">
            A little something I made for you...
        </div>


        <!-- =====================================
             CHARACTER AREA
        ====================================== -->

        <div class="character-stage">

            <!-- Monkey -->
            <img
                src="./assets/photos/monkey.png"
                alt="Monkey"
                class="character monkey"
                id="monkey"
            >

            <!-- Duck -->
            <img
                src="./assets/photos/duck.png"
                alt="Duck"
                class="character duck"
                id="duck"
            >

            <!-- Hug image -->
            <img
                src="./assets/photos/hug.png"
                alt="Monkey and Duck Hugging"
                class="hug-character"
                id="hugCharacter"
            >

            <!-- Hearts -->
            <div class="heart-burst" id="heartBurst">

                <span class="heart h1">❤️</span>
                <span class="heart h2">💗</span>
                <span class="heart h3">💕</span>
                <span class="heart h4">💖</span>
                <span class="heart h5">❤️</span>
                <span class="heart h6">💗</span>
                <span class="heart h7">💕</span>
                <span class="heart h8">💘</span>

            </div>

        </div>


        <!-- =====================================
             TIKU PHOTO
        ====================================== -->

        <div class="tiku-photo-container" id="tikuPhoto">

            <div class="photo-glow"></div>

            <img
                src="./assets/photos/tikucover.jpg"
                alt="Tiku"
                class="tiku-photo"
            >

        </div>


        <!-- =====================================
             BIRTHDAY MESSAGE
        ====================================== -->

        <section class="birthday-message" id="birthdayMessage">

            <h1>
                Happy Birthday Tiku
                <span>❤️</span>
            </h1>

            <p class="love-line">
                Mur priyo Patihah,<br>
                from your Bandor. 🐒❤️🦆
            </p>

            <p class="small-message">
                Some people become a part of your life...
                <br>
                and some people become your life.
            </p>


            <button
                class="story-button"
                id="storyButton"
                type="button"
            >
                ✨ Begin Our Story ❤️
            </button>

        </section>

    </main>


    <!-- =========================================
         STORY SECTION
         We can replace this later with your
         memories, photos, videos, chats etc.
    ========================================== -->

    <section class="story-section" id="storySection">

        <h2>Our Story ❤️</h2>

        <p>
            Every beautiful memory starts somewhere...
        </p>

        <p>
            And ours is just beginning here. ✨
        </p>

    </section>


    <script src="script.js"></script>

</body>
</html>

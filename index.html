<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#080308">

    <title>Happy Birthday Tiku ❤️</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =========================================
         FLOATING BACKGROUND HEARTS
    ========================================== -->

    <div class="hearts" aria-hidden="true">

        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>
        <span>❤️</span>
        <span>💖</span>
        <span>💗</span>
        <span>💕</span>
        <span>❤️</span>

    </div>


    <!-- =========================================
         OPENING SCREEN
    ========================================== -->

    <main class="opening-screen">


        <!-- =====================================
             INTRO TEXT
        ====================================== -->

        <div class="intro-text">

            A LITTLE SOMETHING I MADE FOR YOU...

        </div>


        <!-- =====================================
             MONKEY + DUCK ANIMATION
        ====================================== -->

        <div class="animation-area">


            <!-- Monkey enters from LEFT -->

            <img
                src="assets/photos/monkey.png"
                alt="Cute Monkey"
                class="character monkey"
                id="monkey"
            >


            <!-- Duck enters from RIGHT -->

            <img
                src="assets/photos/duck.png"
                alt="Cute Duck"
                class="character duck"
                id="duck"
            >


            <!--
                This image appears when
                Monkey and Duck hug.
            -->

            <img
                src="assets/photos/hug.png"
                alt="Monkey and Duck Hugging"
                class="hug-character"
                id="hug"
            >

        </div>



        <!-- =====================================
             TIKU PHOTO
        ====================================== -->

        <div
            class="tiku-photo-container"
            id="tikuPhoto"
        >

            <!-- Glow behind photo -->

            <div class="photo-glow"></div>


            <!-- Tiku's actual photo -->

            <img
                src="assets/photos/tikucover.jpg"
                alt="Tiku"
                class="tiku-photo"
            >

        </div>



        <!-- =====================================
             BIRTHDAY MESSAGE
        ====================================== -->

        <section class="birthday-content">


            <!-- Main heading -->

            <h1>

                Happy Birthday Tiku

                <span class="title-heart">
                    ❤️
                </span>

            </h1>


            <!-- Personal message -->

            <p class="love-line">

                Mur priyo Patihah,<br>

                from your Bandor.
                🐒❤️🦆

            </p>


            <!-- Quote -->

            <p class="quote">

                Some people become a part of your life...<br>

                and some people become your life.

            </p>


            <!-- Begin Story Button -->

            <button
                id="beginStory"
                type="button"
            >

                ✨ Begin Our Story ❤️

            </button>


        </section>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>


</body>

</html>
